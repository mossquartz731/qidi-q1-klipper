name: Q1 host PA
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pa-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check actual host kinematics with sanitizers
        run: |
          gcc -Wall -Werror -O2 -fsanitize=address,undefined \
            -Iklippy/chelper test/host/pa_history_test.c \
            klippy/chelper/trapq.c -lm -o "$RUNNER_TEMP/pa-history"
          "$RUNNER_TEMP/pa-history"
